name: 使用求助 / Usage question
description: 获取 CoLand 使用上的帮助。 / Get help using CoLand in your workflow.
title: "[Question]: "
labels: ["question", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        请直接使用中文或英文填写，无需翻译。 / Write in Chinese or English; no translation is needed.
        填写前请先查看[常见问题](https://github.com/VienLi/CoLand/blob/main/FAQ.zh-CN.md)。 / Please check the [FAQ](https://github.com/VienLi/CoLand/blob/main/FAQ.md) first.
        Issue 和附件是公开的，请移除凭证及私人内容。账号、账单、安全问题或需要私人材料的情况，请联系 support@coland.ai。
        Issues and attachments are public. Remove credentials and private content. For account, billing, security concerns, or private details, email support@coland.ai.
  - type: checkboxes
    id: existing-answers
    attributes:
      label: 已有解答 / Existing answers
      options:
        - label: 我已查看 FAQ 并搜索已有 Issue。 / I checked the FAQ and searched existing issues.
          required: true
  - type: textarea
    id: goal
    attributes:
      label: 想完成什么操作？ / What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: 遇到了什么问题？ / Where are you stuck?
      description: 可以提供相关错误提示，请移除私人信息。 / Include any relevant error message, without private data.
    validations:
      required: true
  - type: textarea
    id: attempted-solutions
    attributes:
      label: 已经尝试过哪些方法？ / What have you tried?
      description: 说明尝试后的结果；尚未尝试也可以直接说明。 / Tell us what happened, or say if you have not tried anything yet.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 版本与环境 / Version and environment
      description: CoLand 版本、系统、相关平台或 Agent；官网问题请补充浏览器。 / CoLand version, OS, and relevant platform or Agent. For the website, include your browser.
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息 / Additional context
      description: 选填，可附截图或脱敏日志。 / Optional screenshots or redacted logs.
    validations:
      required: false
