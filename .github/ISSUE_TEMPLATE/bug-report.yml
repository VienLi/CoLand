name: 问题反馈 / Bug report
description: 反馈未按预期工作的功能。 / Report something that is not working as expected.
title: "[Bug]: "
labels: ["bug", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        请直接使用中文或英文填写，无需翻译。 / Write in Chinese or English; no translation is needed.
        填写前请先查看[常见问题](https://github.com/VienLi/CoLand/blob/main/FAQ.zh-CN.md)。 / Please check the [FAQ](https://github.com/VienLi/CoLand/blob/main/FAQ.md) first.
        Issue 和附件是公开的，请移除日志、截图中的凭证及私人内容。账号、账单、安全问题或需要私人材料的情况，请联系 support@coland.ai。
        Issues and attachments are public. Remove credentials and private content from logs and screenshots. For account, billing, security concerns, or private details, email support@coland.ai.
  - type: checkboxes
    id: existing-issues
    attributes:
      label: 已有反馈 / Existing reports
      options:
        - label: 我已搜索已有问题，包括已关闭的 Issue。 / I searched existing issues, including closed ones.
          required: true
  - type: input
    id: affected-feature
    attributes:
      label: 涉及的产品或功能 / Product or feature
      placeholder: "例如：Desktop 的 GitHub 连接 / e.g. Desktop — GitHub connection"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CoLand 版本 / CoLand version
      description: 请填写客户端中的完整版本号；官网问题填写“官网”。 / Copy the version from the app; for website issues, enter “官网” or “Website”.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统环境 / Environment
      description: 系统版本、芯片架构、相关 Agent 版本；官网问题请补充浏览器。 / OS version, chip architecture, relevant Agent version; browser for website issues.
      placeholder: "例如：macOS 15、Apple Silicon、Agent 名称及版本 / e.g. macOS 15, Apple Silicon, Agent name and version"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 问题出现前做了什么？如果偶发，请说明。 / What did you do before the problem appeared? If it is intermittent, say so.
      placeholder: "1. …\n2. …\n3. …"
    validations:
      required: true
  - type: textarea
    id: expected-result
    attributes:
      label: 预期结果 / Expected result
    validations:
      required: true
  - type: textarea
    id: actual-result
    attributes:
      label: 实际结果 / Actual result
      description: 如有错误提示，请提供原文和大致发生时间。 / Include the error message and approximate time if relevant.
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: 截图或脱敏日志 / Screenshots or redacted logs
      description: 选填，上传前请检查是否含有私人信息。 / Optional. Check for private information before attaching anything.
    validations:
      required: false
