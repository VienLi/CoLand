<svg xmlns="http://www.w3.org/2000/svg" id="judgment-evidence-diagram" role="img" aria-labelledby="judgment-evidence-title" aria-describedby="judgment-evidence-desc" width="480" height="423" viewBox="0 0 480 423">
<title id="judgment-evidence-title">从反馈记录到判断依据</title>
<desc id="judgment-evidence-desc">规划示例。负责人要求把夸张优惠文案改为具体条件。整理后的经验同时保留理由、客户范围、误用边界和后续核对依据，不能仅凭一次反馈就认定普遍规则。</desc>
<style>@media(prefers-reduced-motion:reduce){#judgment-evidence-diagram .dot{display:none}}</style>
<rect width="480" height="423" rx="12" fill="#fafaf7"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><rect x="20" y="14" width="440" height="117" rx="12" fill="#f7f0e3" stroke="#d6c7a7"/><text x="42" y="43" font-size="18" fill="#7a6545" text-anchor="start" font-weight="600">一次真实的反馈</text><text x="55" y="80" font-size="23" fill="#695334" text-anchor="start" font-weight="400">「删掉夸张承诺，</text><text x="55" y="112" font-size="23" fill="#695334" text-anchor="start" font-weight="400">改成具体的优惠条件。」</text><text x="240" y="163" font-size="18" fill="#657165" text-anchor="middle" font-weight="400">补全背景、理由与适用范围</text><rect x="20" y="187" width="440" height="216" rx="12" fill="#eef3e9" stroke="#b0bfa8"/><text x="42" y="219" font-size="21" fill="#34483c" text-anchor="start" font-weight="600">可复用的判断依据</text><text x="42" y="257" font-size="17" fill="#657165" text-anchor="start" font-weight="600">为什么</text><text x="135" y="257" font-size="18" fill="#34483c" text-anchor="start" font-weight="400">承诺有依据，表达要准确</text><text x="42" y="294" font-size="17" fill="#657165" text-anchor="start" font-weight="600">适用于</text><text x="135" y="294" font-size="18" fill="#34483c" text-anchor="start" font-weight="400">面向熟悉产品的老客户</text><text x="42" y="331" font-size="17" fill="#657165" text-anchor="start" font-weight="600">不等于</text><text x="135" y="331" font-size="18" fill="#34483c" text-anchor="start" font-weight="400">所有文案都只能列参数</text><text x="42" y="368" font-size="17" fill="#657165" text-anchor="start" font-weight="600">如何核对</text><text x="135" y="368" font-size="18" fill="#34483c" text-anchor="start" font-weight="400">保留改稿、确认与后续纠正</text></g>
</svg>
