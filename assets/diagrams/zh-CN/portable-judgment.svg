ound" stroke-linejoin="round" /><path d="M362 68v4M362 120v4" stroke="#a7b4a4" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M387 68v4M387 120v4" stroke="#a7b4a4" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M412 68v4M412 120v4" stroke="#a7b4a4" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M437 68v4M437 120v4" stroke="#a7b4a4" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="387" y="103" font-size="18" fill="#34483c" text-anchor="middle" font-weight="400">远程模型 A</text><rect x="318" y="152" width="138" height="48" rx="8" fill="#f1ede3" stroke="#bec9bd"/><path d="M337 148v4M337 200v4" stroke="#a7b4a4" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M362 148v4M362 200v4" stroke="#a7b4a4" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M387 148v4M387 200v4" stroke="#a7b4a4" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M412 148v4M412 200v4" stroke="#a7b4a4" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M437 148v4M437 200v4" stroke="#a7b4a4" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="387" y="183" font-size="18" fill="#34483c" text-anchor="middle" font-weight="400">远程模型 B</text><rect x="318" y="232" width="138" height="48" rx="8" fill="#e7efe4" stroke="#bec9bd"/><path d="M337 228v4M337 280v4" stroke="#a7b4a4" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M362 228v4M362 280v4" stroke="#a7b4a4" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M387 228v4M387 280v4" stroke="#a7b4a4" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M412 228v4M412 280v4" stroke="#a7b4a4" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M437 228v4M437 280v4" stroke="#a7b4a4" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="387" y="263" font-size="18" fill="#34483c" text-anchor="middle" font-weight="400">本地模型</text><rect x="24" y="324" width="432" height="49" rx="10" fill="#f2f4ed" stroke="#d9dfd4"/><text x="240" y="355" font-size="18" fill="#34483c" text-anchor="middle" font-weight="500">更换模型，继续沿用业务流程与质量标准</text></g>
</svg>
