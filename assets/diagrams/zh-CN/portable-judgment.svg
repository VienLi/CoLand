<svg xmlns="http://www.w3.org/2000/svg" id="portable-judgment-diagram" role="img" aria-labelledby="portable-judgment-title" aria-describedby="portable-judgment-desc" width="480" height="393" viewBox="0 0 480 393">
<title id="portable-judgment-title">留下经验与标准，让模型可以替换</title>
<desc id="portable-judgment-desc">左侧是个人和企业自己掌握的客户理解、审美判断、工作流程和验收依据；右侧是可以更换的远程或本地模型。迁移目标是让流程延续、交付符合原有标准，仍需实际任务验证。</desc>
<style>@media(prefers-reduced-motion:reduce){#portable-judgment-diagram .dot{display:none}}</style>
<rect width="480" height="393" rx="12" fill="#fafaf7"/>
