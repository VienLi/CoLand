<svg xmlns="http://www.w3.org/2000/svg" id="personal-decision-assets-diagram" role="img" aria-labelledby="personal-decision-assets-title" aria-describedby="personal-decision-assets-desc" width="480" height="452" viewBox="0 0 480 452">
<title id="personal-decision-assets-title">个人与决策 Agent 共同成长</title>
<desc id="personal-decision-assets-desc">未来设计。个人在探索中形成新经验，由本人掌握；决策 Agent 是承接这些经验的数字分身，按判断依据接走重复劳动与决定，让人继续学习。经验可以随个人进入新的团队和工作环境。</desc>
<rect width="480" height="452" rx="12" fill="#fafaf7"/>
