eight="400" fill="#657165">我的数字分身</text><path d="M112 244 C112 276 173 276 173 302" fill="none" stroke="#789784" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#personal-decision-assets-arrow)"/><path d="M308 302 C308 276 368 276 368 244" fill="none" stroke="#789784" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#personal-decision-assets-arrow)"/><text x="98" y="282" text-anchor="middle" font-size="18" font-weight="400" fill="#657165">新的经验</text><text x="385" y="282" text-anchor="middle" font-size="18" font-weight="400" fill="#657165">判断依据</text><rect x="102" y="306" width="276" height="89" rx="12" fill="#f3ead7" stroke="#cbbb9c"/><path d="M122 306 L122 291 Q122 285 128 285 H196 L211 298 H356 Q362 298 362 306" fill="#eee1c5" stroke="#a58b60" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="342" text-anchor="middle" font-size="23" font-weight="600" fill="#34483c">由我掌握的经验</text><text x="240" y="374" text-anchor="middle" font-size="20" font-weight="400" fill="#657165">偏好 · 取舍 · 实践</text><text x="240" y="434" text-anchor="middle" font-size="20" font-weight="400" fill="#657165">随我进入新的团队与工作环境</text>
