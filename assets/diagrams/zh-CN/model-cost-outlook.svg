<svg xmlns="http://www.w3.org/2000/svg" id="model-cost-outlook-diagram" role="img" aria-labelledby="model-cost-outlook-title" aria-describedby="model-cost-outlook-desc" width="480" height="365" viewBox="0 0 480 365" data-duration="4.5">
<title id="model-cost-outlook-title">两种能力，两条成本走势</title>
<desc id="model-cost-outlook-desc">同样输出质量的成本可能降低，而持续使用届时最强模型的成本可能上升。两条虚线仅表示文章的方向判断，没有数值刻度。</desc>
<style>@media(prefers-reduced-motion:reduce){#model-cost-outlook-diagram .dot{display:none}}</style>
<rect width="480" height="365" rx="12" fill="#fafaf7"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="30" y="29" font-size="18" fill="#657165" text-anchor="start" font-weight="400">模型使用成本</text><text x="449" y="29" font-size="15" fill="#657165" text-anchor="end" font-weight="400">趋势假设</text><path d="M72 56V286H428" stroke="#d9dfd4" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M72 170H428" stroke="#d9dfd4" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/><text x="58" y="71" font-size="16" fill="#657165" text-anchor="end" font-weight="400">高</text><text x="58" y="282" font-size="16" fill="#657165" text-anchor="end" font-weight="400">低</text><path d="M86 170C185 170 275 100 408 68" stroke="#b28b57" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><path d="M86 170C185 170 275 230 408 250" stroke="#6e9279" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><circle cx="86" cy="170" r="6" fill="#657165"/><text x="256" y="61" font-size="20" fill="#8b693c" text-anchor="start" font-weight="600">届时的最强能力</text><text x="262" y="277" font-size="20" fill="#34483c" text-anchor="start" font-weight="600">今天的输出质量</text><text x="86" y="312" font-size="18" fill="#657165" text-anchor="middle" font-weight="400">今天</text><text x="408" y="312" font-size="18" fill="#657165" text-anchor="middle" font-weight="400">明年此时</text><text x="240" y="346" font-size="15" fill="#657165" text-anchor="middle" font-weight="400">方向示意，不代表具体价格或涨跌幅</text><circle class="dot" r="5" fill="#b28b57" stroke="white" visibility="hidden"><animateMotion path="M86 170C185 170 275 100 408 68" begin="0.3s" dur="3.8s"/><set attributeName="visibility" to="visible" begin="0.3s" dur="3.8s"/></circle><circle class="dot" r="5" fill="#6e9279" stroke="white" visibility="hidden"><animateMotion path="M86 170C185 170 275 230 408 250" begin="0.3s" dur="3.8s"/><set attributeName="visibility" to="visible" begin="0.3s" dur="3.8s"/></circle></g>
</svg>
