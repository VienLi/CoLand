<svg xmlns="http://www.w3.org/2000/svg" id="decision-delegation-diagram" role="img" aria-labelledby="decision-delegation-title" aria-describedby="decision-delegation-desc" width="480" height="370" viewBox="0 0 480 370">
<title id="decision-delegation-title">更多日常决定，交给熟悉规则的 Agent</title>
<desc id="decision-delegation-desc">文章假设明年经常使用 AI 的个人，会把过半的日常决定交给获得授权的 Agent。人继续处理目标与例外。圆环是方向示意，不表示一个测得的具体占比。</desc>
<style>@media(prefers-reduced-motion:reduce){#decision-delegation-diagram .dot{display:none}}</style>
<rect width="480" height="370" rx="12" fill="#fafaf7"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="240" y="31" font-size="21" fill="#34483c" text-anchor="middle" font-weight="600">在授权范围内，减少逐次确认</text><circle cx="145" cy="176" r="80" fill="none" stroke="#dfe7ef" stroke-width="26"/><circle cx="145" cy="176" r="80" fill="none" stroke="#7e9d82" stroke-width="26" stroke-dasharray="335 503" transform="rotate(-90 145 176)"/><text x="145" y="177" font-size="34" fill="#34483c" text-anchor="middle" font-weight="600">过半</text><text x="145" y="206" font-size="18" fill="#657165" text-anchor="middle" font-weight="400">日常决定</text><circle cx="274" cy="108" r="5" fill="#7e9d82"/><text x="287" y="114" font-size="21" fill="#34483c" text-anchor="start" font-weight="600">Agent 执行</text><text x="287" y="145" font-size="18" fill="#657165" text-anchor="start" font-weight="400">已有规则</text><text x="287" y="171" font-size="18" fill="#657165" text-anchor="start" font-weight="400">熟悉的选择</text><circle cx="274" cy="220" r="5" fill="#8096ac"/><text x="287" y="226" font-size="21" fill="#34483c" text-anchor="start" font-weight="600">人保留</text><text x="287" y="257" font-size="18" fill="#657165" text-anchor="start" font-weight="400">目标与例外</text><text x="240" y="317" font-size="18" fill="#34483c" text-anchor="middle" font-weight="400">由一次次确认，走向依据约定自主处理</text><text x="240" y="351" font-size="15" fill="#657165" text-anchor="middle" font-weight="400">预测示意；圆环分配不代表统计比例</text></g>
</svg>
