<svg xmlns="http://www.w3.org/2000/svg" id="agent-majority-diagram" role="img" aria-labelledby="agent-majority-title" aria-describedby="agent-majority-desc" width="480" height="320" viewBox="0 0 480 320">
<title id="agent-majority-title">两种占比，一起改变组织构成</title>
<desc id="agent-majority-desc">第一种占比比较持续参与工作的 Agent 与人。第二种比较主要由 Agent 执行的任务与主要由人执行的任务。文章预期较早采用 AI 的组织中，两种占比均由 Agent 领先。图形不表示实际人数或统计比例。</desc>
<style>@media(prefers-reduced-motion:reduce){#agent-majority-diagram .dot{display:none}}</style>
