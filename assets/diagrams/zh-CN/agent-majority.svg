"/><circle cx="-6" cy="-2" r="1.6" fill="#34483c" stroke="none"/><circle cx="6" cy="-2" r="1.6" fill="#34483c" stroke="none"/><path d="M-5 6H5" stroke-linecap="round"/></g><g transform="translate(412 80) scale(1.0)" stroke="#6e9279" stroke-width="1.8" fill="#e6efe3"><rect x="-15" y="-12" width="30" height="25" rx="8"/><path d="M0 -12V-18M-19 -4V5M19 -4V5" fill="none" stroke-linecap="round"/><circle cy="-19" r="2.4"/><circle cx="-6" cy="-2" r="1.6" fill="#34483c" stroke="none"/><circle cx="6" cy="-2" r="1.6" fill="#34483c" stroke="none"/><path d="M-5 6H5" stroke-linecap="round"/></g><text x="101" y="130" font-size="18" fill="#536c84" text-anchor="middle" font-weight="400">人</text><text x="324" y="130" font-size="18" fill="#34483c" text-anchor="middle" font-weight="400">持续参与工作的 Agent</text><path d="M24 154H456" stroke="#d9dfd4" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="24" y="190" font-size="20" fill="#34483c" text-anchor="start" font-weight="600">工作占比</text><rect x="24" y="211" width="432" height="53" rx="10" fill="#e4ebf1" stroke="none"/><path d="M34 211H349V264H34Q24 264 24 254V221Q24 211 34 211Z" stroke="none" stroke-width="2" fill="#dce9d8" stroke-linecap="round" stroke-linejoin="round" /><text x="185" y="245" font-size="20" fill="#34483c" text-anchor="middle" font-weight="600">主要由 Agent 执行</text><text x="401" y="245" font-size="18" fill="#536c84" text-anchor="middle" font-weight="400">人执行</text><text x="240" y="300" font-size="15" fill="#657165" text-anchor="middle" font-weight="400">人数与分工为示意，不代表实际数量或比例</text></g>
