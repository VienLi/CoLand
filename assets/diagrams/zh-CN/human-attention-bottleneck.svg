one"/><path d="M-5 6H5" stroke-linecap="round"/></g><circle cx="348" cy="79" r="28" fill="#eef3e9"/><g transform="translate(348 79) scale(1)" stroke="#6e9279" stroke-width="1.8" fill="#e6efe3"><rect x="-15" y="-12" width="30" height="25" rx="8"/><path d="M0 -12V-18M-19 -4V5M19 -4V5" fill="none" stroke-linecap="round"/><circle cy="-19" r="2.4"/><circle cx="-6" cy="-2" r="1.6" fill="#34483c" stroke="none"/><circle cx="6" cy="-2" r="1.6" fill="#34483c" stroke="none"/><path d="M-5 6H5" stroke-linecap="round"/></g><circle cx="420" cy="79" r="28" fill="#eef3e9"/><g transform="translate(420 79) scale(1)" stroke="#6e9279" stroke-width="1.8" fill="#e6efe3"><rect x="-15" y="-12" width="30" height="25" rx="8"/><path d="M0 -12V-18M-19 -4V5M19 -4V5" fill="none" stroke-linecap="round"/><circle cy="-19" r="2.4"/><circle cx="-6" cy="-2" r="1.6" fill="#34483c" stroke="none"/><circle cx="6" cy="-2" r="1.6" fill="#34483c" stroke="none"/><path d="M-5 6H5" stroke-linecap="round"/></g><text x="240" y="132" font-size="18" fill="#657165" text-anchor="middle" font-weight="400">更多 Agent 已就绪</text><rect x="30" y="165" width="122" height="77" rx="10" fill="#eeeae0" stroke="#dcd5c5"/><rect x="27" y="169" width="122" height="77" rx="10" fill="#f5f0e5" stroke="#dcd5c5"/><rect x="24" y="173" width="122" height="77" rx="10" fill="#fffdf7" stroke="#d3c4aa"/><text x="85" y="201" font-size="21" fill="#735b3c" text-anchor="middle" font-weight="600">待安排</text><text x="85" y="228" font-size="18" fill="#756750" text-anchor="middle" font-weight="400">安排分工</text><rect x="182" y="165" width="122" height="77" rx="10" fill="#eeeae0" stroke="#dcd5c5"/><rect x="179" y="169" width="122" height="77" rx="10" fill="#f5f0e5" stroke="#dcd5c5"/><rect x="176" y="173" width="122" height="77" rx="10" fill="#fffdf7" stroke="#d3c4aa"/><text x="237" y="201" font-size="21" fill="#735b3c" text-anchor="middle" font-weight="600">待审核</text><text x="237" y="228" font-size="18" fill="#756750" text-anchor="middle" font-weight="400">是否合格</text><rect x="334" y="165" width="122" height="77" rx="10" fill="#eeeae0" stroke="#dcd5c5"/><rect x="331" y="169" width="122" height="77" rx="10" fill="#f5f0e5" stroke="#dcd5c5"/><rect x="328" y="173" width="122" height="77" rx="10" fill="#fffdf7" stroke="#d3c4aa"/><text x="389" y="201" font-size="21" fill="#735b3c" text-anchor="middle" font-weight="600">待决定</text><text x="389" y="228" font-size="18" fill="#756750" text-anchor="middle" font-weight="400">下一步选择</text><g transform="translate(240 298) scale(1.8)" stroke="#8096ac" stroke-width="1.8" fill="#e6edf3"><circle cy="-7" r="8"/><path d="M-15 19C-15 0 15 0 15 19Z"/></g><g transform="translate(331 298)"><circle r="22" fill="#fff" stroke="#b28b57" stroke-width="2"/><circle r="2" fill="#b28b57"/><g><path d="M0 0V-13M0 0L8 4" fill="none" stroke="#b28b57" stroke-width="2" stroke-linecap="round"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" begin="0s" dur="4.4s" fill="freeze"/></g></g><text x="240" y="361" font-size="18" fill="#34483c" text-anchor="middle" font-weight="400">安排、审核与决策，都在占用同一个人</text></g>
