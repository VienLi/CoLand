<svg xmlns="http://www.w3.org/2000/svg" id="human-attention-bottleneck-diagram" role="img" aria-labelledby="human-attention-bottleneck-title" aria-describedby="human-attention-bottleneck-desc" width="480" height="382" viewBox="0 0 480 382" data-duration="4.6">
<title id="human-attention-bottleneck-title">很多 Agent，仍在等同一个人</title>
<desc id="human-attention-bottleneck-desc">Agent 数量增加后，任务分派、结果审核和关键决定仍然排队等待人的注意力。时钟表示人的时间持续消耗，不代表实测处理时长。</desc>
<style>@media(prefers-reduced-motion:reduce){#human-attention-bottleneck-diagram .dot{display:none}}</style>
<rect width="480" height="382" rx="12" fill="#fafaf7"/>
