<svg xmlns="http://www.w3.org/2000/svg" id="judgment-model-routing-diagram" role="img" aria-labelledby="judgment-model-routing-title" aria-describedby="judgment-model-routing-desc" width="480" height="456" viewBox="0 0 480 456">
<title id="judgment-model-routing-title">The decision agent retains standards while execution models change</title>
<desc id="judgment-model-routing-desc">A proposed next-stage architecture. Experience and acceptance standards remain in a decision-agent layer controlled by the person or team. It defines requirements, chooses models, and reviews results. The same standards guide model changes and migrations, checked through real tasks.</desc>
<style>@media(prefers-reduced-motion:reduce){#judgment-model-routing-diagram .dot{display:none}}</style>
<rect width="480" height="456" rx="12" fill="#fafaf7"/>
