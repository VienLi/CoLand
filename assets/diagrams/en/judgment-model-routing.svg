"72" rx="10" fill="#edf1f4" stroke="#aebbc5"/><text x="84" y="315" font-size="20" fill="#465e73" text-anchor="middle" font-weight="600">Frontier</text><text x="84" y="342" font-size="17" fill="#5d7183" text-anchor="middle" font-weight="400">Reasoning</text><rect x="172" y="284" width="136" height="72" rx="10" fill="#edf1f4" stroke="#aebbc5"/><text x="240" y="315" font-size="20" fill="#465e73" text-anchor="middle" font-weight="600">Lightweight</text><text x="240" y="342" font-size="17" fill="#5d7183" text-anchor="middle" font-weight="400">Defined tasks</text><rect x="328" y="284" width="136" height="72" rx="10" fill="#edf1f4" stroke="#aebbc5"/><text x="396" y="315" font-size="20" fill="#465e73" text-anchor="middle" font-weight="600">Local</text><text x="396" y="342" font-size="17" fill="#5d7183" text-anchor="middle" font-weight="400">Private work</text><rect x="24" y="386" width="432" height="50" rx="10" fill="#f0f3eb" stroke="#d4dfcf"/><text x="240" y="418" font-size="20" fill="#34483c" text-anchor="middle" font-weight="400">Change execution models; keep work standards</text></g>
