<svg id="feedback-routing-diagram" xmlns="http://www.w3.org/2000/svg" width="420" height="426" viewBox="0 0 420 426" role="img" aria-roledescription="workflow comparison" aria-labelledby="feedback-routing-title" aria-describedby="feedback-routing-desc">
  <title id="feedback-routing-title">Keep your attention on the code</title>
  <desc id="feedback-routing-desc">The old workflow has five steps: notice a change, leave the PR to find a conversation, explain the location and request, return and find your place, then resume reading. With CoLand, comment beside the code and let the system deliver it. Stay in the PR.</desc>
  <rect width="420" height="426" rx="12" fill="#fafaf7"/>
  <style>@media(prefers-reduced-motion:reduce){#feedback-routing-diagram .dot{display:none}}</style>
  <defs>
    <marker id="feedback-routing-manual" viewBox="0 0 10 10" markerWidth="5.5" markerHeight="5.5" refX="8" refY="5" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#ad6957" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="feedback-routing-linked" viewBox="0 0 10 10" markerWidth="5.5" markerHeight="5.5" refX="8" refY="5" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#64876c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <text x="106" y="29" font-size="18" font-weight="600" fill="#8b5c4f">Before</text>
    <text x="314" y="29" font-size="18" font-weight="600" fill="#385744">With CoLand</text>
    <g data-side="old"><rect x="14" y="52" width="184" height="49" rx="9" fill="#f6f1e5" stroke="#c5b48f"/><text x="106" y="82" font-size="16" font-weight="500" fill="#66583d">Spot a needed change</text></g>
    <g data-side="old"><rect x="14" y="128" width="184" height="49" rx="9" fill="#f9eae4" stroke="#b57562"/><text x="106" y="158" font-size="16" font-weight="500" fill="#763e30">Leave PR, find chat</text></g>
    <g data-side="old"><rect x="14" y="204" width="184" height="49" rx="9" fill="#f6f4ee" stroke="#ad9e85"/><text x="106" y="234" font-size="16" font-weight="500" fill="#4f473c">Explain the change</text></g>
    <g data-side="old"><rect x="14" y="280" width="184" height="49" rx="9" fill="#f9eae4" stroke="#b57562"/><text x="106" y="310" font-size="16" font-weight="500" fill="#763e30">Return, find your place</text></g>
    <g data-side="old"><rect x="14" y="356" width="184" height="49" rx="9" fill="#f6f1e5" stroke="#c5b48f"/><text x="106" y="386" font-size="16" font-weight="500" fill="#66583d">Resume reading</text></g>
    <g data-side="new"><rect x="222" y="52" width="184" height="49" rx="9" fill="#edf4ec" stroke="#84a38b"/><text x="314" y="82" font-size="16" font-weight="600" fill="#385744">Comment on the code</text></g>
    <g data-side="new"><rect x="222" y="128" width="184" height="49" rx="9" fill="#edf4ec" stroke="#84a38b"/><text x="314" y="158" font-size="16" font-weight="600" fill="#385744">CoLand delivers it</text></g>
    <text x="314" y="233" font-size="18" font-weight="600" fill="#52775e">Stay in the PR</text>
    <text x="314" y="261" font-size="17" fill="#52775e">Keep reading</text>
  </g>
  <path class="flow" d="M106 103C101 112 101 117 106 125" fill="none" stroke="#ad6957" stroke-width="1.7" marker-end="url(#feedback-routing-manual)"/>
  <path class="flow" d="M106 179C101 188 101 193 106 201" fill="none" stroke="#ad6957" stroke-width="1.7" marker-end="url(#feedback-routing-manual)"/>
  <path class="flow" d="M106 255C101 264 101 269 106 277" fill="none" stroke="#ad6957" stroke-width="1.7" marker-end="url(#feedback-routing-manual)"/>
  <path class="flow" d="M106 331C101 340 101 345 106 353" fill="none" stroke="#ad6957" stroke-width="1.7" marker-end="url(#feedback-routing-manual)"/>
  <path class="flow" d="M314 103C319 112 319 117 314 125" fill="none" stroke="#64876c" stroke-width="1.7" marker-end="url(#feedback-routing-linked)"/>
</svg>
