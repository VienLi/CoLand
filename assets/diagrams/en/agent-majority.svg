<svg xmlns="http://www.w3.org/2000/svg" id="agent-majority-diagram" role="img" aria-labelledby="agent-majority-title" aria-describedby="agent-majority-desc" width="480" height="320" viewBox="0 0 480 320">
<title id="agent-majority-title">Two shares change the organization</title>
<desc id="agent-majority-desc">One share counts agents and people who participate consistently. The other compares tasks mainly executed by agents with those mainly executed by people. We expect agents to lead both in early-adopting organizations. This is an illustration, not measured proportions.</desc>
<style>@media(prefers-reduced-motion:reduce){#agent-majority-diagram .dot{display:none}}</style>
