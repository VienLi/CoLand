<svg xmlns="http://www.w3.org/2000/svg" id="portable-judgment-diagram" role="img" aria-labelledby="portable-judgment-title" aria-describedby="portable-judgment-desc" width="480" height="393" viewBox="0 0 480 393">
<title id="portable-judgment-title">Keep experience and standards while changing models</title>
<desc id="portable-judgment-desc">People and organizations retain customer understanding, judgment, workflows, and acceptance criteria. Remote or local models can change. The goal is continuity of work and quality, validated through real tasks.</desc>
<style>@media(prefers-reduced-motion:reduce){#portable-judgment-diagram .dot{display:none}}</style>
