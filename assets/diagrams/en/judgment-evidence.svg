<svg xmlns="http://www.w3.org/2000/svg" id="judgment-evidence-diagram" role="img" aria-labelledby="judgment-evidence-title" aria-describedby="judgment-evidence-desc" width="480" height="423" viewBox="0 0 480 423">
<title id="judgment-evidence-title">From feedback to judgment criteria</title>
<desc id="judgment-evidence-desc">A proposed example: replace exaggerated promotion claims with specific terms. The retained experience includes reasoning, audience, limits, and review evidence. One comment alone does not establish a universal rule.</desc>
<style>@media(prefers-reduced-motion:reduce){#judgment-evidence-diagram .dot{display:none}}</style>
<rect width="480" height="423" rx="12" fill="#fafaf7"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><rect x="20" y="14" width="440" height="117" rx="12" fill="#f7f0e3" stroke="#d6c7a7"/><text x="42" y="43" font-size="18" fill="#7a6545" text-anchor="start" font-weight="600">A piece of feedback</text><text x="55" y="80" font-size="23" fill="#695334" text-anchor="start" font-weight="400">“Remove exaggerated claims;</text><text x="55" y="112" font-size="23" fill="#695334" text-anchor="start" font-weight="400">give the specific offer terms.”</text><text x="240" y="163" font-size="18" fill="#657165" text-anchor="middle" font-weight="400">Add context, reasoning, and scope</text><rect x="20" y="187" width="440" height="216" rx="12" fill="#eef3e9" stroke="#b0bfa8"/><text x="42" y="219" font-size="21" fill="#34483c" text-anchor="start" font-weight="600">Reusable judgment criteria</text><text x="42" y="257" font-size="17" fill="#657165" text-anchor="start" font-weight="600">Why</text><text x="135" y="257" font-size="18" fill="#34483c" text-anchor="start" font-weight="400">Make accurate, supported claims</text><text x="42" y="294" font-size="17" fill="#657165" text-anchor="start" font-weight="600">For</text><text x="135" y="294" font-size="18" fill="#34483c" text-anchor="start" font-weight="400">Existing customers who know us</text><text x="42" y="331" font-size="17" fill="#657165" text-anchor="start" font-weight="600">Not</text><text x="135" y="331" font-size="18" fill="#34483c" text-anchor="start" font-weight="400">Copy limited to specifications</text><text x="42" y="368" font-size="17" fill="#657165" text-anchor="start" font-weight="600">Verify</text><text x="135" y="368" font-size="18" fill="#34483c" text-anchor="start" font-weight="400">Keep revisions and corrections</text></g>
</svg>
