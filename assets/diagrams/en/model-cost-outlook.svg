<svg xmlns="http://www.w3.org/2000/svg" id="model-cost-outlook-diagram" role="img" aria-labelledby="model-cost-outlook-title" aria-describedby="model-cost-outlook-desc" width="480" height="365" viewBox="0 0 480 365" data-duration="4.5">
<title id="model-cost-outlook-title">Two capabilities, two cost trends</title>
<desc id="model-cost-outlook-desc">Matching today’s output quality may get cheaper, while continually using the strongest available model may cost more. The dashed lines show hypotheses without numerical scales.</desc>
<style>@media(prefers-reduced-motion:reduce){#model-cost-outlook-diagram .dot{display:none}}</style>
<rect width="480" height="365" rx="12" fill="#fafaf7"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="30" y="29" font-size="18" fill="#657165" text-anchor="start" font-weight="400">Model usage cost</text><text x="449" y="29" font-size="15" fill="#657165" text-anchor="end" font-weight="400">Trend hypothesis</text><path d="M72 56V286H428" stroke="#d9dfd4" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M72 170H428" stroke="#d9dfd4" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/><text x="58" y="71" font-size="16" fill="#657165" text-anchor="end" font-weight="400">High</text><text x="58" y="282" font-size="16" fill="#657165" text-anchor="end" font-weight="400">Low</text><path d="M86 170C185 170 275 100 408 68" stroke="#b28b57" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><path d="M86 170C185 170 275 230 408 250" stroke="#6e9279" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><circle cx="86" cy="170" r="6" fill="#657165"/><text x="256" y="61" font-size="20" fill="#8b693c" text-anchor="start" font-weight="600">Frontier capability</text><text x="262" y="277" font-size="20" fill="#34483c" text-anchor="start" font-weight="600">Today’s output quality</text><text x="86" y="312" font-size="18" fill="#657165" text-anchor="middle" font-weight="400">Today</text><text x="408" y="312" font-size="18" fill="#657165" text-anchor="middle" font-weight="400">Next year</text><text x="240" y="346" font-size="15" fill="#657165" text-anchor="middle" font-weight="400">Directional illustration, not a price or percentage forecast</text><circle class="dot" r="5" fill="#b28b57" stroke="white" visibility="hidden"><animateMotion path="M86 170C185 170 275 100 408 68" begin="0.3s" dur="3.8s"/><set attributeName="visibility" to="visible" begin="0.3s" dur="3.8s"/></circle><circle class="dot" r="5" fill="#6e9279" stroke="white" visibility="hidden"><animateMotion path="M86 170C185 170 275 230 408 250" begin="0.3s" dur="3.8s"/><set attributeName="visibility" to="visible" begin="0.3s" dur="3.8s"/></circle></g>
</svg>
