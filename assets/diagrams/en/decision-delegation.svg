<svg xmlns="http://www.w3.org/2000/svg" id="decision-delegation-diagram" role="img" aria-labelledby="decision-delegation-title" aria-describedby="decision-delegation-desc" width="480" height="370" viewBox="0 0 480 370">
<title id="decision-delegation-title">Delegate daily decisions to agents familiar with the rules</title>
<desc id="decision-delegation-desc">We hypothesize that regular AI users may delegate more than half of everyday decisions to authorized agents next year. People retain goals and exceptions. The ring illustrates a forecast, not a measured percentage.</desc>
<style>@media(prefers-reduced-motion:reduce){#decision-delegation-diagram .dot{display:none}}</style>
<rect width="480" height="370" rx="12" fill="#fafaf7"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="240" y="31" font-size="21" fill="#34483c" text-anchor="middle" font-weight="600">Fewer approvals within agreed limits</text><circle cx="145" cy="176" r="80" fill="none" stroke="#dfe7ef" stroke-width="26"/><circle cx="145" cy="176" r="80" fill="none" stroke="#7e9d82" stroke-width="26" stroke-dasharray="335 503" transform="rotate(-90 145 176)"/><text x="145" y="177" font-size="34" fill="#34483c" text-anchor="middle" font-weight="600">Over half</text><text x="145" y="206" font-size="18" fill="#657165" text-anchor="middle" font-weight="400">Daily decisions</text><circle cx="274" cy="108" r="5" fill="#7e9d82"/><text x="287" y="114" font-size="21" fill="#34483c" text-anchor="start" font-weight="600">Agent handles</text><text x="287" y="145" font-size="18" fill="#657165" text-anchor="start" font-weight="400">Known rules</text><text x="287" y="171" font-size="18" fill="#657165" text-anchor="start" font-weight="400">Familiar choices</text><circle cx="274" cy="220" r="5" fill="#8096ac"/><text x="287" y="226" font-size="21" fill="#34483c" text-anchor="start" font-weight="600">People retain</text><text x="287" y="257" font-size="18" fill="#657165" text-anchor="start" font-weight="400">Goals and exceptions</text><text x="240" y="317" font-size="18" fill="#34483c" text-anchor="middle" font-weight="400">From repeated approval to acting on agreed rules</text><text x="240" y="351" font-size="15" fill="#657165" text-anchor="middle" font-weight="400">Forecast illustration; the ring is not statistical data</text></g>
</svg>
